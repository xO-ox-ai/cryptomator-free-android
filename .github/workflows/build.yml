name: Cryptomator Free build

on:
  push:
    branches: [free]
  pull_request:
    branches: [free]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build free Lite APK and verify access
        run: >-
          bash ./gradlew :presentation:assembleLiteDebug
          :presentation:testLiteDebugUnitTest -PfreeBuild=true
          --tests org.cryptomator.presentation.licensing.FreeBuildLicenseEnforcerTest
          --tests org.cryptomator.presentation.docprovider.HelpersTest
          --tests org.cryptomator.presentation.presenter.VaultListPresenterTest
          --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Cryptomator-Free-debug
          path: presentation/build/outputs/apk/lite/debug/*.apk
